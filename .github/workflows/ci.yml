name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13']  # Supported python versions

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      # Optional cache to speed C/C++ rebuilds (kept lean)
      - name: Enable ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ci-${{ runner.os }}-py${{ matrix.python }}

      - name: Install package + test deps
        run: |
          python -m pip install -U pip
          pip install -e .[test]

      # torch is not in the [test] extra (see pyproject.toml). Install it on the
      # one leg that requires it below, so the GPU engine's CPU-device parity
      # cases really run without making every release-wheel leg need a torch build.
      - name: Install torch (GPU-engine parity leg)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: pip install "torch>=2.1"

      - name: Run tests
        run: pytest -q
        env:
          # Require torch on one leg so that a future torch install failure fails
          # the build instead of silently skipping the whole GPU suite, which is
          # how it went untested before. Only ubuntu/3.11: the other legs have no
          # torch installed and skip cleanly.
          PYBTLS_REQUIRE_TORCH: ${{ (matrix.os == 'ubuntu-latest' && matrix.python == '3.11') && '1' || '0' }}

  # Build sdist once on linux
  sdist-smoke:
    name: sdist smoke test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build sdist
        run: |
          python -m pip install -U pip build
          python -m build --sdist
      - name: Install sdist into clean venv and import
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install dist/*.tar.gz
          python -c "import pybtls; print('pybtls version:', getattr(pybtls, '__version__', 'unknown'))"
